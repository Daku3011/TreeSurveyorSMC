services:
  - type: web
    name: tree-surveyor-smc
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt && python seed.py
    startCommand: gunicorn wsgi:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: smc-tree-db
          property: connectionString
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: AI_PROVIDER
        value: openrouter

databases:
  - name: smc-tree-db
    plan: free
    databaseName: smc_tree_census
    user: postgres
    region: oregon
